[env:esp8285]
platform = espressif8266
board = esp8285
framework = arduino
monitor_speed = 115200
build_flags = 
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_ASYNC_WEB_SERVER
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    greiman/SdFat@^2.2.0
    ayushsharma82/ESPAsyncWebServer@^3.0.0
    me-no-dev/ESPAsyncTCP@^1.2.0
