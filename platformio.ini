; PlatformIO Project Configuration File

[env:esp8285]
platform = espressif8266
board = esp8285
framework = arduino

; Serial Monitor options
monitor_speed = 115200

; Upload options
upload_speed = 460800

; Build options
build_flags =
    -D LED_PIN=2
    -D SD_CS=4
    -D MISO_PIN=12
    -D MOSI_PIN=13
    -D SCLK_PIN=14
    -D USE_SD_FAT=1

; Filesystem image for SPIFFS/LittleFS
board_build.filesystem = littlefs

; Libraries
lib_deps =
    greiman/SdFat@^2.2.3
