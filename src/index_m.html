<!-- index_m.html (для SD карты, мобильная версия) -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SD Manager Mobile</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --danger: #e74c3c;
            --success: #2ecc71;
            --bg: #ecf0f1;
            --text: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
            overflow: hidden;
        }
        .header {
            background: var(--primary);
            color: white;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2em;
        }
        .preview-container {
            height: 35vh;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid #ddd;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .preview-placeholder {
            color: #999;
            font-size: 1em;
        }
        .file-manager {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }
        .toolbar {
            padding: 5px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
        }
        .toolbar button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            background: var(--secondary);
            color: white;
            font-size: 1em;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .toolbar button.danger { background: var(--danger); }
        .toolbar input[type="file"] { display: none; }
        .file-input-label {
            background: var(--secondary);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
        }
        .breadcrumbs {
            padding: 3px 10px;
            background: #f1f1f1;
            border-bottom: 1px solid #ddd;
            font-size: 0.9em;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .file-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 1em;
        }
        .file-item:active { background: #e3f2fd; }
        .file-icon { margin-right: 10px; font-size: 1.2em; }
        .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-size { margin-left: 5px; color: #666; font-size: 0.8em; }
        .file-actions {
            display: flex;
            gap: 8px;
            margin-left: 5px;
        }
        .file-actions button {
            background: none;
            border: none;
            font-size: 1.2em;
            padding: 2px 5px;
        }
        .upload-progress {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            display: none;
            z-index: 100;
        }
        .progress-bar {
            height: 15px;
            background: #444;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-bar-inner {
            height: 100%;
            background: var(--success);
            width: 0;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 320px;
        }
        .modal-content h3 { margin-bottom: 15px; }
        .modal-content input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        .modal-buttons {
            margin-top: 15px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-buttons button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
        }
        .modal-buttons .ok { background: var(--secondary); color: white; }
        .modal-buttons .cancel { background: #ddd; }
    </style>
</head>
<body>
    <div class="header">
        <span>📁 SD Manager</span>
        <span id="status"></span>
    </div>
    <div class="preview-container" id="previewContainer">
        <div class="preview-placeholder">Выберите .gcode</div>
    </div>
    <div class="file-manager">
        <div class="toolbar">
            <button onclick="goUp()">⬆️</button>
            <button onclick="refreshFiles()">🔄</button>
            <button onclick="showMkdirModal()">📁</button>
            <label class="file-input-label" for="fileInput">📤</label>
            <input type="file" id="fileInput" multiple>
            <button onclick="showRenameModal()">✏️</button>
            <button class="danger" onclick="deleteSelected()">🗑</button>
        </div>
        <div class="breadcrumbs" id="breadcrumbs">/</div>
        <ul class="file-list" id="fileList"></ul>
    </div>
    <div class="upload-progress" id="uploadProgress">
        <div>Загрузка...</div>
        <div class="progress-bar"><div class="progress-bar-inner" id="progressBarInner"></div></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalTitle"></h3>
            <input type="text" id="modalInput">
            <div class="modal-buttons">
                <button class="ok" onclick="modalOk()">OK</button>
                <button class="cancel" onclick="modalCancel()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        let currentPath = '/';
        let selectedFile = null;
        let modalCallback = null;

        document.addEventListener('DOMContentLoaded', () => {
            refreshFiles();
            document.getElementById('fileInput').addEventListener('change', (e) => {
                uploadFiles(e.target.files);
                e.target.value = '';
            });
            updateStatus();
            setInterval(updateStatus, 5000);
        });

        function updateStatus() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('status').textContent = data.sd ? 'SD OK' : 'SD ERR';
                })
                .catch(() => document.getElementById('status').textContent = 'OFFLINE');
        }

        function refreshFiles() {
            fetch('/api/list?path=' + encodeURIComponent(currentPath))
                .then(r => r.json())
                .then(data => {
                    currentPath = data.path;
                    document.getElementById('breadcrumbs').textContent = currentPath;
                    renderFileList(data.files);
                });
        }

        function renderFileList(files) {
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            files.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.dataset.path = file.path;
                li.onclick = () => {
                    if (file.isDir) {
                        selectFile(file);
                        // Двойной тап для входа в папку
                        if (li.dataset.lastTap && Date.now() - li.dataset.lastTap < 300) {
                            navigateTo(file.path);
                        } else {
                            li.dataset.lastTap = Date.now();
                            setTimeout(() => delete li.dataset.lastTap, 300);
                        }
                    } else {
                        selectFile(file);
                        if (file.name.toLowerCase().endsWith('.gcode')) {
                            showPreview(file.path);
                        }
                    }
                };
                const icon = file.isDir ? '📁' : '📄';
                const sizeStr = file.isDir ? '' : formatSize(file.size);
                li.innerHTML = `
                    <span class="file-icon">${icon}</span>
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">${sizeStr}</span>
                    <span class="file-actions">
                        ${file.isDir ? '' : `<button onclick="event.stopPropagation(); downloadFile('${file.path}')">⬇️</button>`}
                        <button onclick="event.stopPropagation(); showRenameModal('${file.path}')">✏️</button>
                        <button onclick="event.stopPropagation(); deleteFile('${file.path}')">🗑</button>
                    </span>
                `;
                list.appendChild(li);
            });
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
            return (bytes/1024/1024).toFixed(1) + ' MB';
        }

        function selectFile(file) {
            selectedFile = file;
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('selected'));
            const item = document.querySelector(`.file-item[data-path="${file.path}"]`);
            if (item) item.classList.add('selected');
        }

        function navigateTo(path) {
            currentPath = path;
            refreshFiles();
        }

        function goUp() {
            if (currentPath === '/') return;
            const parts = currentPath.split('/').filter(p => p);
            parts.pop();
            currentPath = '/' + parts.join('/');
            if (currentPath === '') currentPath = '/';
            refreshFiles();
        }

        function showPreview(path) {
            const container = document.getElementById('previewContainer');
            fetch('/api/thumbnail?path=' + encodeURIComponent(path))
                .then(r => {
                    if (r.ok) {
                        return r.blob().then(blob => {
                            const url = URL.createObjectURL(blob);
                            container.innerHTML = `<img src="${url}">`;
                        });
                    } else {
                        container.innerHTML = '<div class="preview-placeholder">Нет миниатюры</div>';
                    }
                })
                .catch(() => container.innerHTML = '<div class="preview-placeholder">Ошибка</div>');
        }

        function downloadFile(path) {
            window.location.href = '/api/download?path=' + encodeURIComponent(path);
        }

        function uploadFiles(files) {
            if (!files.length) return;
            const progressDiv = document.getElementById('uploadProgress');
            const progressBar = document.getElementById('progressBarInner');
            progressDiv.style.display = 'block';
            progressBar.style.width = '0%';

            let completed = 0;
            const total = files.length;
            const uploadNext = (index) => {
                if (index >= files.length) {
                    progressDiv.style.display = 'none';
                    refreshFiles();
                    return;
                }
                const file = files[index];
                const formData = new FormData();
                formData.append('file', file);
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/upload?path=' + encodeURIComponent(currentPath), true);
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = (completed + (e.loaded / e.total)) / total * 100;
                        progressBar.style.width = percent + '%';
                    }
                };
                xhr.onload = () => {
                    if (xhr.status === 200) {
                        completed++;
                        uploadNext(index + 1);
                    } else {
                        alert('Ошибка загрузки');
                        progressDiv.style.display = 'none';
                    }
                };
                xhr.onerror = () => {
                    alert('Ошибка сети');
                    progressDiv.style.display = 'none';
                };
                xhr.send(formData);
            };
            uploadNext(0);
        }

        function showMkdirModal() {
            modalCallback = (name) => {
                fetch('/api/mkdir', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path: currentPath + '/' + name})
                }).then(() => refreshFiles());
            };
            document.getElementById('modalTitle').textContent = 'Новая папка';
            document.getElementById('modalInput').value = '';
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modalInput').focus();
        }

        function showRenameModal(path = null) {
            if (!path && !selectedFile) return;
            const file = path ? {path: path, name: path.split('/').pop()} : selectedFile;
            modalCallback = (newName) => {
                fetch('/api/rename', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path: file.path, newName: newName})
                }).then(() => refreshFiles());
            };
            document.getElementById('modalTitle').textContent = 'Переименовать';
            document.getElementById('modalInput').value = file.name;
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modalInput').focus();
            document.getElementById('modalInput').select();
        }

        function deleteSelected() {
            if (!selectedFile) { alert('Выберите файл'); return; }
            deleteFile(selectedFile.path);
        }

        function deleteFile(path) {
            if (!confirm('Удалить ' + path + '?')) return;
            fetch('/api/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({path: path})
            }).then(() => refreshFiles());
        }

        function modalOk() {
            const value = document.getElementById('modalInput').value.trim();
            if (value && modalCallback) modalCallback(value);
            document.getElementById('modal').style.display = 'none';
        }

        function modalCancel() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
